name: Build and deployment checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build && npm run build:server
      - run: npm run deploy:configure -- --local
      - run: docker compose --env-file .deploy-smoke/compose.env config --quiet
      - run: docker compose --env-file .deploy-smoke/compose.env up -d --build --wait --wait-timeout 120
      - run: npm run test:deployment
      - name: Remove disposable test services
        if: always()
        run: docker compose --env-file .deploy-smoke/compose.env down --volumes --remove-orphans
