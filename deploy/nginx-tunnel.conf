# Existing Cloudflare tunnel -> host nginx -> Docker gateway.
# This site is for slopcity.fun only; default/other sites stay in place.
server {
    listen 80;
    server_name slopcity.fun;
    client_max_body_size 16k;

    # Only the local cloudflared process may supply Cloudflare visitor identity.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # Bounded base64 image upload; every other route keeps the small request limit.
    location ~ ^/game/api/community/submissions/?$ {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
